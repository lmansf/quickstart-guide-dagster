[project]
name = "cadence"
version = "0.1.0"
description = "Cadence Hall — a Dagster quickstart: marketing, ticketing, and admissions for a live-music venue"
requires-python = ">=3.11,<3.12"
dependencies = [
  "dagster==1.13.20",
  "dagster-webserver==1.13.20",
  "dagster-duckdb==0.29.20",
  "dagster-duckdb-pandas==0.29.20",
  "pandas==2.3.3",
  "duckdb==1.5.5",
  "pytest==9.1.1",
  "ruff==0.16.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cadence"]

[tool.dagster]
module_name = "cadence.definitions"     # bare `dagster dev` autodiscovers defs

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
